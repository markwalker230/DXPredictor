name: Deploy DX Predictor

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          # 1. Navigate to your project directory on the VPS
          cd /opt/dxpredictor || { echo "Directory not found"; exit 1; }
          
          # 2. Pull the latest code from the main branch
          git pull origin main
          
          # 3. Stop and remove the existing container
          docker-compose down || docker stop dxpredictor && docker rm dxpredictor || true
          
          # 4. Build the new Docker image and start the container
          docker-compose up -d --build
          
          # 5. Clean up old, unused Docker images to save space
          docker image prune -f
